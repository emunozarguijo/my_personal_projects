# Blueprint de Render (plan free, costo cero). Render → New → Blueprint → elige este repo.
# La BD es Neon (también gratis); Render solo corre la API web.
# Los valores con `sync: false` te los pide Render al crear el Blueprint; nunca los pongas aquí.
services:
  - type: web
    name: estado-cuenta-ai
    runtime: python
    plan: free
    region: virginia            # cerca de Neon us-east-1
    branch: main
    autoDeploy: false           # el deploy lo dispara GitHub Actions solo si pasan los tests
    buildCommand: pip install -r requirements.txt
    # Migraciones pendientes → clasifica compras sin categoría (idempotente) → arranca.
    # --proxy-headers: la IP real del cliente (límite de intentos de login).
    startCommand: python -m app.migrate && python -m app.categorize_backfill && uvicorn app.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

      # --- Base de datos (Neon) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        sync: false
      - key: DB_SSLMODE
        value: require

      # --- LLM ---
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      # Precios (USD por millón de tokens) para que la pestaña Métricas muestre el costo real del chat.
      - key: PRICE_INPUT_PER_MTOK
        value: "2"
      - key: PRICE_OUTPUT_PER_MTOK
        value: "10"
      # Clasificación de gastos: reglas + Claude Haiku para los comercios que las reglas no reconocen.
      - key: CATEGORIZER_MODEL
        value: claude-haiku-5-5

      # --- Embeddings ---
      # El modelo local (PyTorch + MiniLM) no cabe en los 512 MB del plan free:
      # en Render se usa el proveedor "fake" (hashing, sin modelo). Misma dimensión que la tabla.
      - key: EMBEDDING_PROVIDER
        value: fake
      - key: EMBEDDING_DIM
        value: "384"

      - key: REDACT_PII
        value: "true"

      # --- Cuentas (multiusuario) ---
      # Código que compartes junto con la URL; sin él nadie puede registrarse (protege tu API key).
      - key: SIGNUP_INVITE_CODE
        sync: false
      # Dueño de los datos que ya existían antes de la migración multiusuario (se usa una sola vez).
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "168"

      # --- Límites de uso por cuenta (0 = sin límite) ---
      - key: MAX_USERS
        value: "50"
      - key: MAX_STATEMENTS_PER_USER
        value: "24"
      - key: MAX_ASKS_PER_DAY
        value: "30"
      - key: MAX_UPLOADS_PER_DAY
        value: "10"
